name: PLOTVERSE visual PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plotverse-visual-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/plotverse/app/MainActivity.java

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/plotverse-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"Found {len(scripts)} inline script block(s)")
          PY
          node --check /tmp/plotverse-inline.js

      - name: Run application smoke tests
        run: node scripts/smoke-test.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK for device review
        uses: actions/upload-artifact@v4
        with:
          name: PLOTVERSE-debug-visual-review
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

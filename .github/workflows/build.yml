name: Build PLOTVERSE APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/plotverse/app/MainActivity.java

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -E "versionName ['\"][^'\"]+['\"]" app/build.gradle | head -n 1 | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\1/")
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK
        run: gradle assembleRelease

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLOTVERSE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing PLOTVERSE_KEYSTORE_BASE64 secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/plotverse-release.jks"
          test -s "$RUNNER_TEMP/plotverse-release.jks"

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.PLOTVERSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLOTVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLOTVERSE_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing PLOTVERSE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing PLOTVERSE_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing PLOTVERSE_KEY_PASSWORD secret" && exit 1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/PLOTVERSE-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/plotverse-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out PLOTVERSE.apk "$RUNNER_TEMP/PLOTVERSE-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose PLOTVERSE.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLOTVERSE-signed-apk
          path: PLOTVERSE.apk
          if-no-files-found: error

      - name: Publish or update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          NOTES="PLOTVERSE Android v$VERSION_NAME. Automatically refreshed from the latest successful main build. APK is signed with the persistent PLOTVERSE release key."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" PLOTVERSE.apk --clobber
            gh release edit "$RELEASE_TAG" --title "PLOTVERSE v$VERSION_NAME" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" PLOTVERSE.apk --title "PLOTVERSE v$VERSION_NAME" --notes "$NOTES"
          fi

name: Build PLOTVERSE APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - 'scripts/**'

concurrency:
  group: plotverse-main-build-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Validate project structure
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/plotverse/app/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found in index.html")
          Path("${{ runner.temp }}/plotverse-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s) for syntax validation")
          PY
          node --check "$RUNNER_TEMP/plotverse-inline.js"

      - name: Run JavaScript smoke tests
        run: node scripts/smoke-test.js

      - name: Determine release version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          tags = subprocess.run(
              ["git", "tag", "--list", "v[0-9]*", "--sort=-version:refname"],
              check=True, capture_output=True, text=True
          ).stdout.splitlines()
          gradle = Path("app/build.gradle").read_text()
          fallback = re.search(r"versionName\\s+['\\\"]([^'\\\"]+)['\\\"]", gradle)
          current = tags[0][1:] if tags else (fallback.group(1) if fallback else "0.5.0")
          parts = current.split(".")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit(f"Invalid latest version: {current}")
          parts[-1] = str(int(parts[-1]) + 1)
          name = ".".join(parts)
          code = int(os.environ["GITHUB_RUN_NUMBER"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"name={name}\\n")
              output.write(f"tag=v{name}\\n")
              output.write(f"code={code}\\n")
          print(f"Building release {name} (versionCode {code})")
          PY

      - name: Build unsigned release APK
        run: gradle -PplotverseVersionCode=${{ steps.version.outputs.code }} -PplotverseVersionName=${{ steps.version.outputs.name }} assembleRelease

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLOTVERSE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing PLOTVERSE_KEYSTORE_BASE64 secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/plotverse-release.jks"
          test -s "$RUNNER_TEMP/plotverse-release.jks"

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.PLOTVERSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLOTVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLOTVERSE_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing PLOTVERSE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing PLOTVERSE_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing PLOTVERSE_KEY_PASSWORD secret" && exit 1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/PLOTVERSE-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/plotverse-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out PLOTVERSE.apk "$RUNNER_TEMP/PLOTVERSE-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose PLOTVERSE.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLOTVERSE-signed-apk
          path: PLOTVERSE.apk
          if-no-files-found: error

      - name: Publish new versioned GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          NOTES="PLOTVERSE Android v$VERSION_NAME. Automatically published from the latest successful main build. APK is signed with the persistent PLOTVERSE release key."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite a versioned release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" PLOTVERSE.apk \
            --title "PLOTVERSE v$VERSION_NAME" \
            --notes "$NOTES"

name: Build PLOTVERSE APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found in repository root"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          ROOT=$(find extracted -name settings.gradle -type f -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "settings.gradle not found inside ZIP"
            exit 1
          fi
          cp -a "$ROOT"/. .
          test -f app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PLOTVERSE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLOTVERSE-debug-apk
          path: PLOTVERSE.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" PLOTVERSE.apk \
            --title "PLOTVERSE $GITHUB_REF_NAME" \
            --notes "PLOTVERSE Android update. Download PLOTVERSE.apk and install it over the existing app if the signing key matches."

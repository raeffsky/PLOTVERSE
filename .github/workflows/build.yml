name: Build PLOTVERSE APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'

concurrency:
  group: plotverse-main-build-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Validate project structure
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/plotverse/app/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found in index.html")
          Path("${{ runner.temp }}/plotverse-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s) for syntax validation")
          PY
          node --check "$RUNNER_TEMP/plotverse-inline.js"

      - name: Run JavaScript smoke tests
        run: node scripts/smoke-test.js

      - name: Increment version for new main build
        if: github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          code = re.search(r"versionCode\s+(\d+)", s)
          name = re.search(r"versionName\s+['\"]([^'\"]+)['\"]", s)
          if not code or not name:
              raise SystemExit("Could not find versionCode/versionName in app/build.gradle")
          parts = name.group(1).split(".")
          if len(parts) < 3 or not all(x.isdigit() for x in parts):
              raise SystemExit("versionName must be numeric, e.g. 0.5.0")
          parts[-1] = str(int(parts[-1]) + 1)
          new_name = ".".join(parts)
          new_code = int(code.group(1)) + 1
          s = s[:code.start(1)] + str(new_code) + s[code.end(1):]
          name = re.search(r"versionName\s+['\"]([^'\"]+)['\"]", s)
          s = s[:name.start(1)] + new_name + s[name.end(1):]
          p.write_text(s)
          print(f"Next release version: {new_name} (versionCode {new_code})")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "Bump PLOTVERSE version for next release [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -E "versionName ['\"][^'\"]+['\"]" app/build.gradle | head -n 1 | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\1/")
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"


      - name: Build unsigned release APK
        run: gradle assembleRelease

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLOTVERSE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing PLOTVERSE_KEYSTORE_BASE64 secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/plotverse-release.jks"
          test -s "$RUNNER_TEMP/plotverse-release.jks"

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.PLOTVERSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLOTVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLOTVERSE_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing PLOTVERSE_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing PLOTVERSE_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing PLOTVERSE_KEY_PASSWORD secret" && exit 1)
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/PLOTVERSE-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/plotverse-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out PLOTVERSE.apk "$RUNNER_TEMP/PLOTVERSE-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose PLOTVERSE.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLOTVERSE-signed-apk
          path: PLOTVERSE.apk
          if-no-files-found: error

      - name: Publish new versioned GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          NOTES="PLOTVERSE Android v$VERSION_NAME. Automatically published from the latest successful main build. APK is signed with the persistent PLOTVERSE release key."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite a versioned release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" PLOTVERSE.apk \
            --title "PLOTVERSE v$VERSION_NAME" \
            --notes "$NOTES"

name: Restore PLOTVERSE project files from ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted
          ROOT=$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "Could not find settings.gradle in the ZIP."
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "Using project root: $ROOT"
          test -f "$ROOT/app/src/main/assets/index.html"
          cp -a "$ROOT"/. .
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/plotverse/app/MainActivity.java
          test -f app/src/main/assets/index.html

      - name: Commit restored project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.gradle build.gradle gradle.properties app .github/workflows
          if git diff --cached --quiet; then
            echo "No project file changes to commit."
            exit 0
          fi
          git commit -m "Restore PLOTVERSE Android project structure from ZIP"
          git push

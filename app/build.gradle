plugins {
    id 'com.android.application'
}

android {
    namespace 'com.plotverse.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.plotverse.app'
        minSdk 23
        targetSdk 35
        versionCode project.hasProperty('plotverseVersionCode') ? project.property('plotverseVersionCode').toString().toInteger() : 27
        versionName project.hasProperty('plotverseVersionName') ? project.property('plotverseVersionName').toString() : '0.5.24'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}
